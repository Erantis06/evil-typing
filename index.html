<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>name generator</title>

<style>
  html, body {
    margin: 0;
    background: #292b47;
    color: #eceae3;
    font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace;
  }

  #stage {
    width: 800px;
    height: 400px;
    overflow: hidden;
    position: relative;
    display: grid;
    place-items: center;
    text-align: center;
    background: #23243d;
  }

  .container {
    width: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  h1 {
    margin: 0;
    color: #ff6b6b;
    font-size: 30px;
  }

  .name-display {
    width: 90%;
    min-height: 45px;
    padding: 10px;
    border: 2px solid #ff6b6b;
    border-radius: 8px;
    background: #292b47;
    color: #eceae3;
    font-size: 24px;
    overflow-wrap: anywhere;
  }

  .letter {
    font-size: 36px;
    color: #ffd166;
    font-weight: bold;
  }

  input[type="range"] {
    width: 400px;
    accent-color: #ff6b6b;
    cursor: pointer;
  }

  .buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    padding: 10px 15px;
    border: 2px solid #ff6b6b;
    border-radius: 8px;
    background: #292b47;
    color: #eceae3;
    font: inherit;
    cursor: pointer;
  }

  button:hover {
    background: #ff6b6b;
    color: #23243d;
  }

  .hint {
    margin: 0;
    color: #aaaac0;
    font-size: 13px;
  }
</style>
</head>

<body>
  <div id="stage">
    <div class="container">

      <h1>WHAT IS YOUR FULL NAME?</h1>

      <div class="name-display" id="nameDisplay">
        Your name will appear here...
      </div>

      <div>
        <p>Selected letter:</p>
        <div class="letter" id="letterDisplay">A</div>
      </div>

      <input
        type="range"
        id="letterSlider"
        min="0"
        max="25"
        value="0"
      >

      <div class="buttons">
        <button id="addLetter">Add letter</button>
        <button id="addSpace">Add space</button>
        <button id="clearName">Clear</button>
      </div>

      <p class="hint">
        Use the slider to select a letter, then add it to your name.
      </p>

    </div>
  </div>

  <script>
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    const slider = document.getElementById("letterSlider");
    const letterDisplay = document.getElementById("letterDisplay");
    const nameDisplay = document.getElementById("nameDisplay");

    const addLetterButton = document.getElementById("addLetter");
    const addSpaceButton = document.getElementById("addSpace");
    const clearButton = document.getElementById("clearName");

    let name = "";
    let letters = [];

    // Shuffle the letters into a random order
    function shuffleLetters() {
      letters = alphabet.split("");

      for (let i = letters.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));

        const temp = letters[i];
        letters[i] = letters[randomIndex];
        letters[randomIndex] = temp;
      }
    }

    // Display the currently selected letter
    function updateLetter() {
      const index = Number(slider.value);
      letterDisplay.textContent = letters[index];
    }

    // Shuffle the slider and reset it to the beginning
    function resetSlider() {
      shuffleLetters();
      slider.value = 0;
      updateLetter();
    }

    // Update the name display
    function updateName() {
      if (name.length === 0) {
        nameDisplay.textContent = "Your name will appear here...";
      } else {
        nameDisplay.textContent = name;
      }
    }

    // Shuffle letters when the page first loads
    resetSlider();

    // Update the selected letter when the slider moves
    slider.addEventListener("input", function() {
      updateLetter();
    });

    // Add the selected letter and shuffle again
    addLetterButton.addEventListener("click", function() {
      const index = Number(slider.value);

      name += letters[index];
      updateName();

      resetSlider();
    });

    // Add a space between names
    addSpaceButton.addEventListener("click", function() {
      if (name.length > 0 && !name.endsWith(" ")) {
        name += " ";
        updateName();
      }
    });

    // Clear the entire name
    clearButton.addEventListener("click", function() {
      name = "";
      updateName();
      resetSlider();
    });
  </script>
</body>
</html>
